<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RISC-V simulator</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <h1>RISC-V simulator</h1>

      <div class="radna-povrsina">
        <section class="panel panel-program">
          <div class="panel-zaglavlje">
            <h2>PROGRAM</h2>
            <div class="program-kontrole">
              <select id="example" aria-label="Izaberi primer programa"></select>
              <button id="open-documentation" type="button">Dokumentacija</button>
            </div>
          </div>

          <!-- Rezim pisanja: kod se menja. -->
          <textarea id="editor" spellcheck="false"></textarea>

          <!-- Rezim izvrsavanja: isti kod, nepromenljiv, sa markerom i breakpointima. -->
          <div id="listing" hidden></div>

          <div id="errors" class="greske"></div>
        </section>

        <aside class="bocni-paneli">
          <section class="panel">
            <h2>REGISTRI</h2>
            <div id="registers"></div>
          </section>

          <section class="panel">
            <h2>MEMORIJA</h2>
            <div id="memory"></div>
          </section>
        </aside>
      </div>

      <div class="traka">
        <button id="assemble">Asembliraj</button>
        <button id="edit">Izmeni</button>
        <span class="razmak"></span>
        <!-- Znakovi su Unicode; &#xFE0E; trazi tekstualni prikaz umesto emodzija. -->
        <button id="run" disabled><span class="ikona">&#x25B6;&#xFE0E;</span>Run</button>
        <button id="step" disabled><span class="ikona">&#x2192;</span>Step</button>
        <button id="reset" disabled><span class="ikona">&#x21BB;</span>Reset</button>
        <button id="breakpoint" disabled><span class="ikona">&#x25CF;</span>Breakpoint</button>
        <span id="status" class="status"></span>
      </div>
    </div>

    <dialog id="documentation" aria-labelledby="documentation-title">
      <div class="dokumentacija-zaglavlje">
        <h2 id="documentation-title">RISC-V instrukcije</h2>
        <form method="dialog">
          <button type="submit" aria-label="Zatvori dokumentaciju">Zatvori</button>
        </form>
      </div>
      <div id="documentation-content"></div>
    </dialog>

    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
