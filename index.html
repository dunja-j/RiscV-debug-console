<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RISC-V simulator</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- PRIVREMENI UI (M3.5) - zamenjuje se pravim rasporedom u M6. -->
    <div id="app">
      <h1>RISC-V simulator</h1>

      <div class="kolone">
        <div>
          <h2>Kod</h2>
          <textarea id="source" rows="12" cols="36" spellcheck="false"></textarea>
          <div class="dugmad">
            <button id="step">Step</button>
            <button id="reset">Reset</button>
          </div>
          <pre id="status"></pre>
          <pre id="errors" class="greske"></pre>
        </div>

        <div>
          <h2>Izvrsavanje</h2>
          <pre id="program"></pre>
        </div>

        <div>
          <h2>Registri</h2>
          <pre id="registers"></pre>
        </div>
      </div>
    </div>

    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
