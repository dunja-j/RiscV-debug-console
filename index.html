<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RISC-V simulator</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="paleta-2">
    <div id="app">
      <h1>RISC-V simulator</h1>

      <div class="radna-povrsina">
        <section class="panel panel-program">
          <h2>PROGRAM</h2>

          <!-- Rezim pisanja: kod se menja. -->
          <textarea id="editor" spellcheck="false"></textarea>

          <!-- Rezim izvrsavanja: isti kod, nepromenljiv, sa markerom i breakpointima. -->
          <div id="listing" hidden></div>

          <div id="errors" class="greske"></div>
        </section>

        <aside class="bocni-paneli">
          <section class="panel">
            <h2>REGISTRI</h2>
            <div id="registers"></div>
          </section>

          <section class="panel">
            <h2>MEMORIJA</h2>
            <div id="memory"></div>
          </section>
        </aside>
      </div>

      <div class="traka">
        <button id="assemble">Asembliraj</button>
        <button id="edit">Izmeni</button>
        <span class="razmak"></span>
        <button id="step" disabled>Step</button>
        <button id="run" disabled>Run</button>
        <button id="reset" disabled>Reset</button>
        <button id="breakpoint" disabled>Breakpoint</button>
        <span id="status" class="status"></span>
      </div>
    </div>

    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
